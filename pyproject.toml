[project]
name = "agentgate"
version = "0.1.0"
description = "多租户 LLM/Agent 网关:鉴权、限流、配额计费、流式代理、异步任务与故障转移"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 需要真实 Redis/PG 的集成测试(离线时跳过,结果与单测口径分列)",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE001:网关降级语义有意盲捕(Redis 挂→降级、解析失败→跳过),均带日志,见各处注释
# RUF059:循环解包约定(`for _stream, messages in ...`)以 `_` 前缀表达意图
ignore = ["BLE001", "RUF059"]

[tool.ruff.lint.per-file-ignores]
# 演示/压测编排脚本:清理路径 try-pass 与 async 内起子进程是有意编排(非热路径)
"scripts/demo_*.py" = ["S110", "ASYNC220"]
"scripts/load_workers.py" = ["S110", "ASYNC220"]
"scripts/load_test.py" = ["S110", "ASYNC220"]
"scripts/smoke_real.py" = ["S110", "ASYNC220"]

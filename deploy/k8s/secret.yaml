# 敏感配置模板(P4-3)。占位值——apply 前必须全部替换;
# 生产建议 ExternalSecrets/Vault 直注,明文 Secret 仅演示形态。
apiVersion: v1
kind: Secret
metadata:
  name: agentgate-secret
  labels:
    app: agentgate
type: Opaque
stringData:
  AGENTGATE_ADMIN_TOKEN: "REPLACE-STRONG-TOKEN"
  # Fernet 主密钥:cryptography.fernet.Fernet.generate_key() 生成
  AGENTGATE_CHANNEL_ENC_KEY: "REPLACE-FERNET-KEY"
  AGENTGATE_UPSTREAM_API_KEY: "REPLACE-UPSTREAM-KEY"

# 敏感配置模板(P4-3)。占位值——apply 前必须全部替换;
# 生产建议 ExternalSecrets/Vault 直注,明文 Secret 仅演示形态。
# GATE-1(评审 4.0):全部占位值以 MUST-REPLACE 起头 —— kubectl get secret -o yaml
# 肉眼可辨、grep MUST-REPLACE 可审计;带着占位值 apply 会因 Fernet 主密钥格式非法
# 在启动期崩溃(main.py→crypto.py),不会静默带病运行,但仍须按上述命令逐一替换。
apiVersion: v1
kind: Secret
metadata:
  name: agentgate-secret
  labels:
    app: agentgate
type: Opaque
stringData:
  AGENTGATE_ADMIN_TOKEN: "MUST-REPLACE-STRONG-TOKEN"
  # Fernet 主密钥:cryptography.fernet.Fernet.generate_key() 生成
  AGENTGATE_CHANNEL_ENC_KEY: "MUST-REPLACE-FERNET-KEY"
  AGENTGATE_UPSTREAM_API_KEY: "MUST-REPLACE-UPSTREAM-KEY"

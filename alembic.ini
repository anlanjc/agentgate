# Alembic migration config (ADR-002: PostgreSQL is the baseline; tests use create_all).
# NOTE: keep this file ASCII-only -- Windows configparser decodes it with the GBK locale codec.
[alembic]
script_location = migrations
prepend_sys_path = .
# Overridden by AGENTGATE_DB_URL env var at runtime (see migrations/env.py)
sqlalchemy.url = postgresql+asyncpg://agentgate:agentgate@localhost:5432/agentgate

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

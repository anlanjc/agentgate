<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>agentgate Playground</title>
<link rel="stylesheet" href="/web-static/style.css">
<style>
  .wrap { display: grid; grid-template-columns: 370px 1fr; gap: 16px; }
  #out { min-height: 380px; max-height: 560px; overflow-y: auto; }
  .hist-item { padding: 6px 10px; border-top: 1px solid var(--line-soft); display: flex; justify-content: space-between; gap: 8px; }
  .hist-item:first-child { border-top: 0; }
  kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 5px; color: var(--dim); }
</style>
</head>
<body>
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#4d6bfe" stroke-width="2"><path d="M12 2L3 7v6c0 5 4 8 9 9 5-1 9-4 9-9V7l-9-5z"/><path d="M8 12h8M8 9v6M16 9v6" stroke-opacity=".55"/></svg></div>
    <h1>agentgate <span>Playground</span></h1>
    <span class="badge" id="ver"></span>
  </div>
  <div class="sub"><span class="dot"></span>穿过全链路试玩:鉴权 → Lua 准入 → 渠道调度 → SSE 流式 → 异步记账 · 所有头部与延迟均为实测 · <kbd>Ctrl+Enter</kbd> 发送</div>

  <div class="wrap">
    <div>
      <div class="card">
        <h2>请求参数</h2>
        <label>API Key(管理台签发,ag- 开头)</label>
        <input id="key" class="mono" placeholder="ag-...">
        <label>模型</label>
        <select id="model"></select>
        <label>Question</label>
        <textarea id="q">用一句话介绍你自己</textarea>
        <div class="row" style="margin-top:10px">
          <label style="margin:0"><input type="checkbox" id="stream" checked> 流式(SSE)</label>
          <label style="margin:0 0 0 14px"><input type="checkbox" id="usage" checked> include_usage</label>
        </div>
        <div class="row" style="margin-top:12px">
          <button id="send" onclick="send()">发送</button>
          <button class="ghost" onclick="loadModels()">刷新模型</button>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>实测指标</h2>
        <div class="metrics" style="grid-template-columns:1fr 1fr">
          <div class="metric"><b id="mTTFT">—</b><span>TTFT 首token (ms)</span></div>
          <div class="metric"><b id="mTotal">—</b><span>总延迟 (ms)</span></div>
          <div class="metric"><b id="mChan">—</b><span>命中渠道</span></div>
          <div class="metric"><b id="mCache">—</b><span>缓存</span></div>
        </div>
        <div class="metric"><b id="mTok" style="font-size:13px">—</b><span>usage prompt / completion / total</span></div>
      </div>
    </div>

    <div class="card">
      <h2>对话 <span id="reqId" class="pill acc" style="display:none"></span></h2>
      <div id="out"></div>
      <div id="hist" class="hist-item" style="border:0"></div>
    </div>
  </div>
  <div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const toast = m => { const t=$('#toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
let history = [];

async function loadModels(){
  try {
    const d = await (await fetch('/v1/models')).json();
    $('#model').innerHTML = d.data.map(m => `<option>${m.id}</option>`).join('');
  } catch(e) { $('#model').innerHTML = '<option>(服务未就绪)</option>'; }
}
const setM = (id, v, cls) => { const el=$(id); el.textContent=v; el.className = cls||''; };

function bubble(cls, html){
  const b = document.createElement('div');
  b.className = 'bubble ' + cls; b.innerHTML = html;
  $('#out').appendChild(b); $('#out').scrollTop = $('#out').scrollHeight;
  return b;
}

async function send(){
  const key = $('#key').value.trim();
  if (!key) { bubble('ai', '请先粘贴 API key(到管理台签发一把)'); return; }
  const stream = $('#stream').checked;
  $('#send').disabled = true;
  setM('#mTTFT','—'); setM('#mTotal','—'); setM('#mChan','—'); setM('#mCache','—'); setM('#mTok','—');
  $('#reqId').style.display = 'none';
  bubble('user', esc($('#q').value));
  const ai = bubble('ai', '<span class="cursor"></span>');
  const t0 = performance.now();
  let ttft = null, out = '';

  const body = { model: $('#model').value, messages: [{ role:'user', content: $('#q').value }] };
  if (stream) { body.stream = true; if ($('#usage').checked) body.stream_options = { include_usage: true }; }

  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    setM('#mChan', resp.headers.get('x-upstream-channel') || '—');
    const cache = resp.headers.get('x-cache') || 'BYPASS';
    setM('#mCache', cache, cache === 'HIT' || cache === 'SEMANTIC_HIT' ? 'good' : '');
    if (resp.headers.get('x-request-id')) {
      $('#reqId').textContent = resp.headers.get('x-request-id');
      $('#reqId').style.display = 'inline-block';
    }
    if (!resp.ok && !(stream && resp.status < 500)) {
      let msg = 'HTTP ' + resp.status;
      try { msg = (await resp.json()).error?.message || msg; } catch(_) {}
      ai.innerHTML = '<span style="color:var(--bad)">' + esc(msg) + '</span>';
      history.unshift({ q: $('#q').value, ms: (performance.now()-t0).toFixed(0), tag: resp.status, bad: true });
      renderHist(); $('#send').disabled = false; return;
    }

    if (!stream) {
      const d = await resp.json();
      out = d.choices?.[0]?.message?.content ?? JSON.stringify(d).slice(0, 400);
      ai.textContent = out;
      setM('#mTotal', (performance.now()-t0).toFixed(0));
      const u = d.usage;
      if (u) setM('#mTok', `${u.prompt_tokens??0}/${u.completion_tokens??0}/${u.total_tokens??0}`);
    } else {
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '', usage = null;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        if (ttft === null && buf.includes('data:')) {
          ttft = performance.now() - t0;
          setM('#mTTFT', ttft.toFixed(0), ttft < 200 ? 'good' : ttft > 1500 ? 'slow' : '');
        }
        let idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (payload === '[DONE]') continue;
          try {
            const evt = JSON.parse(payload);
            const delta = evt.choices?.[0]?.delta?.content;
            if (delta) { out += delta; ai.innerHTML = esc(out) + '<span class="cursor"></span>'; $('#out').scrollTop = $('#out').scrollHeight; }
            if (evt.usage) usage = evt.usage;
            if (evt.error) out += '\n[stream error] ' + (evt.message || '');
          } catch(_) {}
        }
      }
      ai.textContent = out;
      setM('#mTotal', (performance.now()-t0).toFixed(0));
      if (usage) setM('#mTok', `${usage.prompt_tokens??0}/${usage.completion_tokens??0}/${usage.total_tokens??0}`);
    }
    history.unshift({ q: $('#q').value, ms: (performance.now()-t0).toFixed(0), ttft: ttft?.toFixed(0), tag: cache });
    if (history.length > 7) history.pop();
  } catch (e) {
    ai.innerHTML = '<span style="color:var(--bad)">请求失败: ' + esc(e.message) + '</span>';
    history.unshift({ q: $('#q').value, ms: (performance.now()-t0).toFixed(0), tag: 'ERR', bad: true });
  } finally {
    renderHist();
    $('#send').disabled = false;
  }
}

function renderHist(){
  $('#hist').innerHTML = history.map(h =>
    `<span>${esc(h.q.slice(0,16))}… <b class="mono">${h.ms}ms</b>${h.ttft? ' · TTFT '+h.ttft : ''} · <span class="pill ${h.bad?'cool':'acc'}">${h.tag}</span></span>`
  ).join('<span class="muted"> · </span>');
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); send(); }
});
(async () => {
  $('#ver').textContent = 'v' + (await (await fetch('/health')).json()).version;
  await loadModels();
})();
</script>
</body>
</html>

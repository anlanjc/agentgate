<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>agentgate 管理台</title>
<link rel="stylesheet" href="/web-static/style.css">
<style>
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
</style>
</head>
<body>
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#4d6bfe" stroke-width="2"><path d="M12 2L3 7v6c0 5 4 8 9 9 5-1 9-4 9-9V7l-9-5z"/><path d="M8 12h8M8 9v6M16 9v6" stroke-opacity=".55"/></svg></div>
    <h1>agentgate <span>管理台</span></h1>
    <span class="badge" id="ver"></span>
    <input id="adminToken" type="password" placeholder="X-Admin-Token(生产必填)" autocomplete="off"
           style="margin-left:auto;width:210px" title="仅存 sessionStorage,不写 cookie">
    <span class="badge"><a href="/playground" style="color:var(--acc);text-decoration:none">→ Playground</a></span>
  </div>
  <div class="sub"><span class="dot"></span>多租户 LLM/Agent 网关 · 渠道健康 / 租户与 key / 用量对账</div>

  <div class="grid">
    <div class="card">
      <h2>渠道健康(排障第一屏)</h2>
      <table id="ch"><thead><tr><th>渠道</th><th>EMA 延迟</th><th>状态</th><th>连续失败</th></tr></thead><tbody></tbody></table>
      <div class="row" style="margin-top:10px">
        <input id="chName" placeholder="渠道名" style="width:110px">
        <input id="chUrl" placeholder="http://127.0.0.1:PORT/v1" style="flex:1">
        <input id="chModels" placeholder="模型,逗号分隔" style="width:150px">
        <button onclick="registerChannel()">注册渠道</button>
      </div>
    </div>

    <div class="card">
      <h2>租户</h2>
      <div class="row">
        <input id="tName" placeholder="租户名" style="flex:1">
        <button onclick="createTenant()">创建租户</button>
        <button class="ghost" onclick="purgeCache()">清空响应缓存</button>
      </div>
      <table id="tn"><thead><tr><th>ID</th><th>名称</th><th>Webhook</th><th></th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card">
      <h2>签发 virtual key(raw key 只显示一次)</h2>
      <div class="row">
        <select id="kTenant" style="flex:1"></select>
        <input id="kRpm" type="number" value="60" style="width:80px" title="RPM">
        <input id="kTpm" type="number" value="100000" style="width:110px" title="TPM">
        <input id="kBudget" type="number" placeholder="预算 token(空=不限)" style="width:150px">
        <button onclick="issueKey()">签发</button>
      </div>
      <div id="keyOut" class="keybox"></div>
      <label style="margin-top:12px">该租户的 key(吊销立即生效)</label>
      <table id="klist"><thead><tr><th>前缀</th><th>名称</th><th>限额</th><th>状态</th><th></th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card">
      <h2>用量对账</h2>
      <div class="row"><select id="uTenant" style="flex:1" onchange="loadUsage()"></select><button class="ghost" onclick="loadUsage()">刷新</button><button class="ghost" onclick="exportBilling()">导出 CSV</button></div>
      <table id="usage"><thead><tr><th>请求数</th><th>总 token</th><th>分模型</th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card">
      <h2>审计流水(只追加,最近 20 条)</h2>
      <div class="row"><button class="ghost" onclick="loadAudit()">刷新</button></div>
      <table id="audit"><thead><tr><th>动作</th><th>对象</th><th>详情</th><th>时间</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
  <div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const toast = m => { const t=$('#toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); };
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const adminToken = () => sessionStorage.getItem('ag_admin_token') || '';
$('#adminToken').value = adminToken();
$('#adminToken').addEventListener('input', e => sessionStorage.setItem('ag_admin_token', e.target.value.trim()));
const api = (p, opt = {}) => {
  opt.headers = {...(opt.headers || {})};
  const token = adminToken();
  if (token) opt.headers['X-Admin-Token'] = token;
  return fetch('/admin'+p, opt).then(async r => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const msg = r.status === 401 ? '需要有效的 X-Admin-Token' : (j.error?.message || r.status);
      toast(msg);
      throw new Error(msg);
    }
    return j;
  });
};

async function loadChannels(){
  const {channels} = await api('/channels');
  $('#ch tbody').innerHTML = channels.map(c => `<tr>
    <td><b>${esc(c.name)}</b><div class="muted">${esc((c.models||[]).join(', ')||'—')}</div></td>
    <td>${esc(c.ema_ms)} ms</td>
    <td>${c.cooling ? '<span class="pill cool">冷却中</span>' : '<span class="pill ok">健康</span>'}</td>
    <td>${esc(c.fail_streak)}</td></tr>`).join('');
}
async function registerChannel(){
  const models = $('#chModels').value.split(',').map(s=>s.trim()).filter(Boolean);
  await api('/channels', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:$('#chName').value, base_url:$('#chUrl').value, models})});
  toast('渠道已注册'); loadChannels();
}
async function loadTenants(){
  const {tenants} = await api('/tenants');
  $('#tn tbody').innerHTML = tenants.map(t => `<tr>
    <td class="muted">${esc(t.id.slice(0,8))}…</td><td>${esc(t.name)}</td>
    <td class="muted">${t.webhook_url ? '已配置' : '—'}</td>
    <td><button class="ghost" onclick="pickTenant('${esc(t.id)}')">选入签发/对账</button></td></tr>`).join('');
  const opts = tenants.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');
  $('#kTenant').innerHTML = opts; $('#uTenant').innerHTML = opts;
}
function pickTenant(id){ $('#kTenant').value = id; $('#uTenant').value = id; loadUsage(); loadKeyList(); }
async function loadKeyList(){
  const tid = $('#kTenant').value; if (!tid) return;
  try {
    const {keys} = await api(`/tenants/${tid}/keys`);
    $('#klist tbody').innerHTML = keys.map(k => `<tr>
      <td class="muted">${esc(k.prefix)}…</td><td>${esc(k.name||'—')}</td>
      <td class="muted">${esc(k.rpm_limit)}/min</td>
      <td>${k.is_active ? '<span class="pill ok">有效</span>' : '<span class="pill cool">已吊销</span>'}</td>
      <td>${k.is_active ? `<button class="ghost" onclick="revokeKey('${k.key_id}')">吊销</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">无</td></tr>';
  } catch(e) { /* 租户刚创建时无 key,静默 */ }
}
async function revokeKey(kid){
  await api(`/keys/${kid}/deactivate`, {method:'POST'});
  toast('已吊销 ' + kid.slice(0,8)); loadKeyList();
}
async function createTenant(){
  const {id} = await api('/tenants', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name:$('#tName').value})});
  toast('租户已创建 '+id.slice(0,8)); loadTenants();
}
async function issueKey(){
  const body = {name:'web', rpm_limit:+$('#kRpm').value, tpm_limit:+$('#kTpm').value};
  if ($('#kBudget').value) body.budget_tokens = +$('#kBudget').value;
  const {key} = await api(`/tenants/${$('#kTenant').value}/keys`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const out = $('#keyOut'); out.style.display='block'; out.textContent = 'raw key(仅此一次): '+key;
}
async function loadUsage(){
  const tid = $('#uTenant').value; if (!tid) return;
  const u = await api(`/tenants/${tid}/usage`);
  $('#usage tbody').innerHTML = `<tr><td>${esc(u.requests)}</td><td>${esc(u.total_tokens)}</td>
    <td class="muted">${Object.entries(u.by_model).map(([m,v])=>`${esc(m)}×${esc(v.requests)}`).join(' · ')||'—'}</td></tr>`;
}
async function purgeCache(){
  const {purged} = await api('/cache', {method:'DELETE'});
  toast('已清空 '+purged+' 条缓存');
}
async function loadAudit(){
  const {entries} = await api('/audit?limit=20');
  $('#audit tbody').innerHTML = entries.map(e => `<tr>
    <td><b>${esc(e.action)}</b></td><td class="muted">${esc(e.target_type)}:${esc(e.target_id.slice(0,12))}</td>
    <td class="muted">${esc(JSON.stringify(e.detail ?? {})).slice(0,60)}</td>
    <td class="muted">${esc(e.created_at.slice(0,19).replace('T',' '))}</td></tr>`).join('')
    || '<tr><td colspan="4" class="muted">暂无</td></tr>';
}
async function exportBilling(){
  const tid = $('#uTenant').value; if (!tid) { toast('先选入租户'); return; }
  try {
    const r = await fetch(`/admin/tenants/${tid}/billing?format=csv`, {headers: {'X-Admin-Token': adminToken()}});
    if (!r.ok) throw new Error(r.status);
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `billing-${tid}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('账单已导出');
  } catch (e) { toast('导出失败: ' + e.message); }
}
(async () => {
  $('#ver').textContent = 'v' + (await (await fetch('/health')).json()).version;
  await loadChannels(); await loadTenants();
  if ($('#kTenant').value) await loadKeyList();
  if ($('#uTenant').value) await loadUsage();
  await loadAudit();
  setInterval(loadChannels, 5000);  // 渠道健康 5s 自刷新
})();
</script>
</body>
</html>
